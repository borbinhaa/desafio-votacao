services:
  db:
    image: postgres:16-alpine
    container_name: voting-db
    environment:
      POSTGRES_DB: voting
      POSTGRES_USER: voting
      POSTGRES_PASSWORD: voting
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voting -d voting"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only started with `docker compose --profile full up`, so `mvn spring-boot:run` (which starts
  # the compose file by itself) brings up the database alone.
  app:
    build: .
    container_name: voting-api
    profiles: ["full"]
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DOCKER_COMPOSE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
